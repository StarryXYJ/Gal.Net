name: Release

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Local-only candidate version (no upload)
        required: true
        default: 0.1.0-dev.1

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has-releases: ${{ steps.plan.outputs.has-releases }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch master and discover newly eligible version tags
        id: plan
        shell: pwsh
        run: |
          git fetch --no-tags origin '+refs/heads/master:refs/remotes/origin/master'
          if ($LASTEXITCODE -ne 0) { throw 'Could not fetch master.' }
          ./scripts/ci/Get-ReleasePlan.ps1 -EventPath $env:GITHUB_EVENT_PATH -GitHubOutput $env:GITHUB_OUTPUT

  release:
    needs: discover
    if: needs.discover.outputs.has-releases == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    permissions:
      contents: write
    uses: ./.github/workflows/release-build.yml
    with:
      tag: ${{ matrix.tag }}
      version: ${{ matrix.version }}
      commit: ${{ matrix.commit }}
    secrets: inherit
