name: Application portability

on:
  pull_request:
    paths:
      - 'src/Presentation/**'
      - 'src/Infrastructure/**'
      - 'src/Shared/**'
      - 'src/Editor/**'
      - 'src/Samples/GalNet.Sample.CrossPlatform/**'
      - 'src/Samples/GalNet.Sample.Contracts/**'
      - 'GameTestCase/**'
      - 'scripts/ci/publish-applications.py'
      - 'scripts/ci/publish-android-sample.ps1'
      - 'scripts/ci/process_steps.py'
      - 'scripts/ci/test-application-publish.py'
      - 'features/F-20261029-05-cross-platform-applications/probes/mobile/verify-android-package.py'
      - 'packaging/**'
      - 'scripts/release/Pack-NuGet.ps1'
      - 'scripts/release/Test-NuGet.ps1'
      - 'scripts/release/Common.ps1'
      - 'Directory.*.props'
      - 'Directory.Build.targets'
      - 'global.json'
      - '.github/workflows/application-portability.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: applications-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: SDK publish (${{ matrix.rid }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            rid: win-x64
          - os: ubuntu-24.04
            rid: linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock*.json'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Publish and validate real application payloads
        shell: pwsh
        run: |
          python scripts/ci/publish-applications.py --target '${{ matrix.rid }}' --output out/application-portability --bind-game --flavors Developer Player Bound
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload publish reports and step logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: application-publish-${{ matrix.rid }}
          path: |
            out/application-portability/application-publish.json
            out/application-portability/logs/
          if-no-files-found: warn

  nuget:
    name: NuGet package consumers
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock*.json'
      - name: Pack preview NuGet packages and validate external consumers
        shell: pwsh
        run: |
          ./scripts/release/Pack-NuGet.ps1 `
            -Version 0.0.0-dev.1 `
            -OutputDirectory out/nuget-preview/packages `
            -WorkDirectory out/nuget-preview/pack
          ./scripts/release/Test-NuGet.ps1 `
            -Version 0.0.0-dev.1 `
            -PackageDirectory out/nuget-preview/packages `
            -WorkDirectory out/nuget-preview/validation
      - name: Upload NuGet validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nuget-preview-validation
          path: |
            out/nuget-preview/validation/package-validation.json
            out/nuget-preview/pack/logs/
            out/nuget-preview/validation/logs/
          if-no-files-found: warn

  android:
    name: Android ARM64 Mono AOT preview
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock*.json'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Android workload and native toolchain
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;29.0.14206865 cmake;3.22.1'
          log-accepted-android-sdk-licenses: false
      - name: Install .NET Android workload and configure native toolchain
        shell: bash
        run: |
          dotnet workload install android --version 10.0.401.1
          echo "GALNET_ANDROID_NDK=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmake/3.22.1/bin" >> "$GITHUB_PATH"
      - name: Publish GameTestCase ARM64 APK and validate its payload
        shell: pwsh
        run: |
          ./scripts/ci/publish-android-sample.ps1 `
            -OutputDirectory out/application-portability-android `
            -AndroidNdkDirectory $env:GALNET_ANDROID_NDK
      - name: Upload Android publish report and payload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: application-publish-android-arm64
          compression-level: 0
          path: |
            out/application-portability-android/android-publish.json
            out/application-portability-android/android-package-verification.json
            out/application-portability-android/publish/**/*.apk
            out/application-portability-android/logs/
          if-no-files-found: warn
