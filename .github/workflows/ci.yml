name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.401
      - name: Restore workloads
        run: dotnet workload restore GalNet.slnx
      - name: Restore locked dependencies
        run: dotnet restore GalNet.slnx --locked-mode
      - name: Build
        run: dotnet build GalNet.slnx --no-restore --configuration Release -p:ContinuousIntegrationBuild=true
      - name: Test with coverage
        run: dotnet test GalNet.slnx --no-restore --configuration Release --logger "trx;LogFileName=test-results.trx" --results-directory artifacts/test-results --collect:"XPlat Code Coverage"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: artifacts/test-results
          if-no-files-found: warn
