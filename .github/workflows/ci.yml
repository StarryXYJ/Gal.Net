name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        stage: [Format, BuildTest]
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Run shared local CI entry
        shell: pwsh
        run: ./scripts/ci/Invoke-CI.ps1 -Stage ${{ matrix.stage }} -OutputRoot out/ci/${{ matrix.stage }} -Coverage
      - name: Upload check logs and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-${{ matrix.stage }}
          path: out/ci/${{ matrix.stage }}
          if-no-files-found: warn
