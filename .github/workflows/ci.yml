name: CI

on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'features/**'
      - '.agents/**'
      - '**/*.md'
  workflow_dispatch:
    inputs:
      coverage:
        description: Collect code coverage
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  template:
    name: verify Sample template
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Build packages and verify generated game
        shell: pwsh
        run: |
          $version = '0.0.0-dev.1'
          ./scripts/release/Pack-NuGet.ps1 -Version $version -OutputDirectory output/template-feed -WorkDirectory output/template-engine-pack
          python scripts/samples/build-dotnet-template.py --version $version --work-directory output/template-stage --output-directory output/template-package
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/samples/test-dotnet-template.py --package "output/template-package/GalNet.Templates.$version.nupkg" --feed output/template-feed --work-directory output/template-check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: sample-template-ci
          path: |
            output/template-package/*.nupkg
            output/template-feed/*.nupkg
          retention-days: 7
          if-no-files-found: error

  verify:
    name: verify (BuildTest)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify cross-platform release matrix guards
        shell: pwsh
        run: |
          python scripts/release/test-cross-platform-release.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            global.json
            **/packages.lock*.json
      - name: Verify application publish guards
        run: python scripts/ci/test-application-publish.py
      - name: Run shared local CI entry
        shell: pwsh
        env:
          COLLECT_COVERAGE: ${{ inputs.coverage || false }}
        run: |
          $arguments = @{ Stage = 'BuildTest'; OutputRoot = 'out/ci/BuildTest' }
          if ($env:COLLECT_COVERAGE -eq 'true') { $arguments.Coverage = $true }
          ./scripts/ci/Test-PlayerModes.ps1 -OutputRoot out/ci/player-modes
          ./scripts/ci/Invoke-CI.ps1 @arguments
      - name: Upload check logs and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-BuildTest
          path: out/ci
          retention-days: 7
          if-no-files-found: warn
