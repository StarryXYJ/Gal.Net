name: CI

on:
  pull_request:
  workflow_dispatch:
    inputs:
      coverage:
        description: Collect code coverage
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (BuildTest)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            global.json
            **/packages.lock*.json
      - name: Run shared local CI entry
        shell: pwsh
        env:
          COLLECT_COVERAGE: ${{ inputs.coverage || false }}
        run: |
          $arguments = @{ Stage = 'BuildTest'; OutputRoot = 'out/ci/BuildTest' }
          if ($env:COLLECT_COVERAGE -eq 'true') { $arguments.Coverage = $true }
          ./scripts/ci/Invoke-CI.ps1 @arguments
      - name: Upload check logs and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-BuildTest
          path: out/ci
          retention-days: 7
          if-no-files-found: warn
