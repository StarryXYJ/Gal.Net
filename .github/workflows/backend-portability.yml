name: Backend portability

on:
  pull_request:
    paths:
      - 'src/Shared/**'
      - 'src/Infrastructure/GalNet.Media.Audio/**'
      - 'src/Infrastructure/GalNet.Media.Miniaudio/**'
      - 'src/Infrastructure/GalNet.Storage.FileSystem/**'
      - 'src/Tooling/GalNet.SchemaGenerator/**'
      - 'src/Samples/GalNet.Sample.Headless/**'
      - 'src/Samples/GalNet.Sample.Contracts/**'
      - 'test/**'
      - 'scripts/ci/**'
      - 'scripts/test-native-aot.ps1'
      - 'Directory.*'
      - 'global.json'
      - 'NuGet.Config'
      - '.github/workflows/backend-portability.yml'
  workflow_dispatch:
    inputs:
      native_aot:
        description: Include the NativeAOT acceptance matrix
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-backends:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            global.json
            **/packages.lock*.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify CI evidence guards
        shell: pwsh
        run: |
          python scripts/ci/test-backend-checks.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/ci/test-application-publish.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run backend regressions and Headless acceptance
        shell: pwsh
        run: |
          python scripts/ci/verify-backends.py --output artifacts/backend-checks
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-tests-${{ matrix.os }}
          path: artifacts/backend-checks
          if-no-files-found: warn

  native-aot:
    if: github.event_name == 'workflow_dispatch' && inputs.native_aot
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            global.json
            **/packages.lock*.json
      - name: Publish and execute NativeAOT engine acceptance
        shell: pwsh
        run: ./scripts/test-native-aot.ps1
